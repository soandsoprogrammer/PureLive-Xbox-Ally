name: rust-handheld

on:
  push:
    branches: [rust-handheld]
    paths:
      - "gpui-prototype/**"
      - "tools/live_cli/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/rust-handheld.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-handheld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype -> target

      # windows-latest ships Visual Studio with the C++ workload and the Windows
      # SDK, so fxc.exe (the HLSL compiler gpui needs in release) is present.
      - name: Build
        run: cargo build --manifest-path gpui-prototype/Cargo.toml --release --locked

      - name: Run all Rust unit tests
        run: cargo test --manifest-path gpui-prototype/Cargo.toml --release --locked

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'

      - name: Build and test platform helper
        run: |
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location tools/live_cli
          dart test test/handheld_pagination_test.dart test/soop_covers_test.dart
          $testExit = $LASTEXITCODE
          Pop-Location
          if ($testExit -ne 0) { exit $testExit }
          New-Item -ItemType Directory -Force dist | Out-Null
          dart compile exe tools/live_cli/bin/handheld_platforms.dart -o dist/purelive-platforms.exe

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item gpui-prototype/target/release/purelive-gpui.exe dist/
          Get-FileHash dist/purelive-gpui.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: purelive-gpui-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Build and test optional plugins
        shell: pwsh
        run: |
          $manifest = 'gpui-prototype/Cargo.toml'
          cargo test --manifest-path $manifest --release --locked --features plugin-tools --bin purelive-recording --bin purelive-translation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path $manifest --release --locked --features plugin-tools --bin purelive-recording --bin purelive-translation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($plugin in @('recording', 'translation')) {
            $stage = New-Item -ItemType Directory -Force "plugin-dist/$plugin"
            $exe = "purelive-$plugin.exe"
            Copy-Item "gpui-prototype/target/release/$exe" $stage.FullName
            Copy-Item gpui-prototype/Plugins.md $stage.FullName
            Compress-Archive -Path "$($stage.FullName)/*" -DestinationPath "plugin-dist/purelive-$plugin-windows-x64.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: purelive-optional-plugins-windows-x64
          path: plugin-dist/*.zip
          if-no-files-found: error
