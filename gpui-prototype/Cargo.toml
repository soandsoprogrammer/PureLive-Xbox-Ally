[package]
name = "purelive-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
async-lock = "3.5"
gpui-kit = "=0.9.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
m3u8-rs = "6.0.1"
oxideav-core = "0.1.43"
oxideav-h264 = "0.1.12"
oxideav-flv = "0.0.6"
oxideav-mpegts = "0.0.4"
oxideav-mp4 = "0.0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia-codec-aac = "0.5.5"
symphonia-core = "0.5.5"
ureq = { version = "3", features = ["json"] }
unicode-width = "0.2.3"
url = "2"
wry = { version = "0.57", default-features = false }

windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation",
    "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
strip = "symbols"
